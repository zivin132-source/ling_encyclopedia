<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Лингвистическая энциклопедия{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: #f6f1e7;
            color: #2b2b2b;
            line-height: 1.65;
        }
        header {
            background: #3b2f1e;
            color: #f6f1e7;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 6px double #c9a227;
        }
        header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
        header p  { margin: 8px 0 0; opacity: 0.85; font-style: italic; }
        main {
            max-width: 780px;
            margin: 40px auto;
            padding: 0 20px;
        }
        a { color: #8a5a00; }
        .card {
            background: #fffdf7;
            border: 1px solid #e0d6bf;
            border-left: 6px solid #c9a227;
            padding: 24px 28px;
            margin-bottom: 24px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .card h2 { margin-top: 0; color: #3b2f1e; }
        blockquote {
            margin: 24px 0;
            padding: 18px 24px;
            background: #fdf6df;
            border-left: 5px solid #c9a227;
            font-style: italic;
            font-size: 1.15rem;
        }
        blockquote cite { display: block; margin-top: 8px; font-size: 0.95rem; color: #6b5c3b; }
        .facts { list-style: "★  "; padding-left: 26px; }
        .facts li { margin-bottom: 6px; }
        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.9rem;
            color: #6b5c3b;
        }
        .back { display: inline-block; margin-bottom: 20px; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>📖 Лингвистическая энциклопедия</h1>
        <p>для любознательных школьников</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>© Лингвистическая энциклопедия • простыми словами о науке о языке</footer>
</body>
</html>
